# ESP-IDF 组件管理器依赖清单：首次配置时根据版本约束解析并下载到 managed_components。
# dependencies.lock 记录已解析版本，managed_components 是外部依赖目录。
# button=按键，qrcode=二维码，esp_lvgl_port=界面移植，xiaozhi-fonts=中文与表情字库。
# esp_codec_dev=ES8311 驱动抽象，esp-sr=唤醒/VAD，esp_audio_codec=Opus 编解码。
# esp_websocket_client=WebSocket 通信；下面 idf 的版本约束是清单原值，不代表已验证的最低版本。
## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/button: ^4.1.3
  espressif/qrcode: ^0.1.0~2
  espressif/esp_lvgl_port: ^2.6.0
  78/xiaozhi-fonts: ^1.4.0
  espressif/esp_codec_dev: ^1.4.0
  espressif/esp-sr: ^2.1.5
  espressif/esp_audio_codec: ^2.3.0
  espressif/esp_websocket_client: ^1.5.0
